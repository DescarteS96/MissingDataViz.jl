name: Validation
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: julia-actions/cache@v2
      - name: Run validation
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.add(["CSV"])
            include("examples/validation/validate_real_datasets.jl")'
      - uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: examples/validation/results/
